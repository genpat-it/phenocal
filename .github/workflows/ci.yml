name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Release build
        run: cargo build --locked --release

  docker:
    name: Docker image (build + toy run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t phenocal:ci .
      - name: Run the toy example in the container
        run: |
          docker run --rm phenocal:ci --version
          docker run --rm -v "$PWD/examples:/data" -w /tmp phenocal:ci \
            --phenotypes /data/toy_phenotypes.tsv --pairs /data/toy_pairs.tsv \
            --anchor labA --min-support 2 --out /tmp/toy
          docker run --rm -v "$PWD/examples:/data" -w /tmp phenocal:ci \
            --phenotypes /data/toy_phenotypes.tsv --pairs /data/toy_distance_matrix.tsv \
            --anchor labA --min-support 2 --out /tmp/toy_matrix
          docker run --rm -v "$PWD/examples:/data" -w /tmp phenocal:ci \
            --phenotypes /data/toy_phenotypes.tsv --profiles /data/toy_profiles.tsv \
            --anchor labA --min-support 2 --out /tmp/toy_profiles
          docker run --rm --entrypoint "" phenocal:ci /bin/sh -c 'ps >/dev/null && echo "ps ok"'

  pages:
    name: GitHub Pages are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Rebuild the pages and check every number against phenocal
        run: |
          python3 docs/src/build.py docs/index.html docs/src/template.html
          python3 docs/src/build_worked.py docs/worked.html target/release/phenocal
          git diff --exit-code docs/

  installer:
    name: install.sh (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh docker-entrypoint.sh
